# Cloudflare Workers & Static Assets + Native D1 Configuration for SmartVocab.io
name = "smartvocab1"
main = "server/worker.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Native Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "learnenglish"
database_id = "12903698-bea3-4358-9435-51b861f11c0f"

# Default environment variables
[vars]
ADMIN_EMAIL = "huyhoangpham387@gmail.com"
# Cấu hình API gửi mail Render (ví dụ: https://your-service.onrender.com hoặc https://your-service.onrender.com/send-email)
